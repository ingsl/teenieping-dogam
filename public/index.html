<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티니핑 도감</title>
  <meta name="description" content="비공식·비영리 '캐치! 티니핑' 팬 도감. 이름 검색, 기수·등급 필터, 메모리 게임과 퍼즐까지.">
  <meta property="og:title" content="티니핑 도감">
  <meta property="og:description" content="비공식·비영리 '캐치! 티니핑' 팬 도감">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="./"><span class="heart">💖</span>티니핑 도감</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="./" aria-current="page">도감</a>
        <a href="games/">게임</a>
        <a href="#" id="random-link">랜덤핑</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>티니핑 도감</h1>
      <p>모든 티니핑을 한눈에! 이름(한글·영문·초성)으로 찾아보세요.</p>
    </section>

    <section class="toolbar" aria-label="검색과 필터">
      <label class="sr-only" for="q">이름 검색</label>
      <input id="q" class="search" type="search" placeholder="🔍 하츄핑, Heartsping, ㅎㅊㅍ …" autocomplete="off">
      <div class="filter-row" id="season-filter" role="group" aria-label="기수 필터"><span class="label">기수</span></div>
      <div class="filter-row" id="grade-filter" role="group" aria-label="등급 필터"><span class="label">등급</span></div>
      <div class="result-meta">
        <span id="count" aria-live="polite"></span>
      </div>
    </section>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>찾는 티니핑이 없어요 🥲</p>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p><strong>비공식·비영리 팬 페이지</strong>입니다. 광고·후원·판매 등 어떠한 수익화도 하지 않습니다.</p>
      <p>'캐치! 티니핑' 캐릭터의 이름·이미지 등 모든 권리는 <strong>SAMG엔터테인먼트</strong>에 있습니다.</p>
      <p>캐릭터 정보 출처: <a href="https://namu.wiki/" rel="noopener">나무위키</a> (<a href="https://creativecommons.org/licenses/by-nc-sa/2.0/kr/" rel="noopener license">CC BY-NC-SA 2.0 KR</a>), <a href="https://catchteenieping.fandom.com/" rel="noopener">Catch! Teenieping Wiki (Fandom)</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener license">CC BY-SA 3.0</a>). 각 상세 페이지에 원문 링크가 있습니다.</p>
    </div>
  </footer>

  <script type="module" src="js/dogam.js"></script>
</body>
</html>
