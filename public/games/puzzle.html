<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티니핑 퍼즐 게임</title>
  <meta name="description" content="조각을 맞춰 티니핑 그림을 완성하는 퍼즐. 쉬움 3×3부터 고수 6×6까지.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../"><span class="heart">💖</span>티니핑 도감</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="../">도감</a>
        <a href="./" aria-current="page">게임</a>
        <a href="#" id="random-link">랜덤핑</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 1) 설정 메뉴 -->
    <section id="menu">
      <div class="hero">
        <h1>🧩 퍼즐 게임</h1>
        <p>조각을 맞춰 티니핑 그림을 완성해요.</p>
      </div>

      <div class="section">
        <h2>1. 놀이 방법</h2>
        <div class="filter-row" id="mode" role="radiogroup" aria-label="놀이 방법">
          <button class="pill" type="button" data-mode="swap" aria-pressed="true">🔄 바꾸기 — 두 조각을 눌러 자리 바꾸기</button>
          <button class="pill" type="button" data-mode="slide" aria-pressed="false">⬜ 슬라이드 — 빈칸으로 밀기</button>
        </div>
      </div>

      <div class="section">
        <h2>2. 그림 고르기</h2>
        <div class="option-row">
          <div class="preview-thumb" id="preview" aria-label="선택한 그림 미리보기" role="img"></div>
          <div>
            <div id="picked-name" style="font-family:var(--font-display);font-size:1.3rem"></div>
            <div class="option-row">
              <button class="btn ghost" type="button" id="random-pick">🎲 아무나</button>
              <label class="btn ghost" for="upload" style="cursor:pointer">📷 내 사진으로</label>
              <input id="upload" type="file" accept="image/*" class="sr-only">
            </div>
          </div>
        </div>
        <label class="sr-only" for="pick-q">티니핑 찾기</label>
        <input id="pick-q" class="search" type="search" placeholder="🔍 티니핑 찾기" style="margin:8px 0">
        <div class="picker" id="picker"></div>
      </div>

      <div class="section">
        <h2>3. 난이도</h2>
        <div class="level-grid" id="levels"></div>
      </div>
    </section>

    <!-- 2) 게임판 -->
    <section id="game" hidden>
      <div class="hud">
        <div class="stats">
          <span>⏱ <span id="time">0:00</span></span>
          <span>👆 <span id="moves">0</span>번</span>
        </div>
        <div class="actions">
          <button class="btn ghost" id="toggle-num" type="button" aria-pressed="true">🔢 번호</button>
          <button class="btn ghost" id="peek" type="button">👀 정답 보기</button>
          <button class="btn ghost" id="restart" type="button">다시 섞기</button>
          <button class="btn ghost" id="back" type="button">설정</button>
        </div>
      </div>
      <div class="puzzle-wrap">
        <div id="board" class="puzzle-board" aria-label="퍼즐판"></div>
        <p id="hint" style="color:var(--ink-soft);margin:0;text-align:center"></p>
      </div>
    </section>

    <dialog class="result" id="result">
      <h2>완성!</h2>
      <div class="big-stars" id="result-stars"></div>
      <p id="result-text"></p>
      <div class="btns">
        <button class="btn" id="again" type="button">한 번 더</button>
        <button class="btn ghost" id="to-menu" type="button">다른 그림·난이도</button>
      </div>
    </dialog>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p><strong>비공식·비영리 팬 페이지</strong>입니다. 광고·후원·판매 등 어떠한 수익화도 하지 않습니다.</p>
      <p>'캐치! 티니핑' 캐릭터의 이름·이미지 등 모든 권리는 <strong>SAMG엔터테인먼트</strong>에 있습니다. 업로드한 사진은 기기 밖으로 전송되지 않습니다.</p>
    </div>
  </footer>
  <script type="module" src="../js/random.js"></script>
  <script type="module" src="../js/puzzle.js"></script>
</body>
</html>
