<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티니핑 메모리 게임</title>
  <meta name="description" content="같은 티니핑 짝을 찾는 카드 뒤집기 게임. 3×4부터 8×8까지.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../"><span class="heart">💖</span>티니핑 도감</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="../">도감</a>
        <a href="./" aria-current="page">게임</a>
        <a href="#" id="random-link">랜덤핑</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 1) 난이도 메뉴 -->
    <section id="menu">
      <div class="hero">
        <h1>🃏 메모리 게임</h1>
        <p>카드를 두 장씩 뒤집어 같은 티니핑을 찾아요.</p>
      </div>
      <div class="option-row">
        <label for="season">어떤 티니핑으로?</label>
        <select id="season"><option value="">전체 기수</option></select>
      </div>
      <div class="level-grid" id="levels"></div>
    </section>

    <!-- 2) 게임판 -->
    <section id="game" hidden>
      <div class="hud">
        <div class="stats">
          <span>⏱ <span id="time">0:00</span></span>
          <span>👆 <span id="moves">0</span>번</span>
          <span>💗 <span id="pairs">0/0</span></span>
        </div>
        <div class="actions">
          <button class="btn ghost" id="restart" type="button">다시 섞기</button>
          <button class="btn ghost" id="back" type="button">난이도 선택</button>
        </div>
      </div>
      <div id="board" class="memory-board" role="grid" aria-label="메모리 카드판"></div>
    </section>

    <dialog class="result" id="result">
      <h2>모두 찾았어요!</h2>
      <div class="big-stars" id="result-stars"></div>
      <p id="result-text"></p>
      <div class="btns">
        <button class="btn" id="again" type="button">한 번 더</button>
        <button class="btn ghost" id="to-menu" type="button">다른 난이도</button>
      </div>
    </dialog>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p><strong>비공식·비영리 팬 페이지</strong>입니다. 광고·후원·판매 등 어떠한 수익화도 하지 않습니다.</p>
      <p>'캐치! 티니핑' 캐릭터의 이름·이미지 등 모든 권리는 <strong>SAMG엔터테인먼트</strong>에 있습니다.</p>
    </div>
  </footer>
  <script type="module" src="../js/random.js"></script>
  <script type="module" src="../js/memory.js"></script>
</body>
</html>
